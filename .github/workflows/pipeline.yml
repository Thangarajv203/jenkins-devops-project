name: CI-CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Unit Tests
        run: |
          pytest

      - name: Build Artifact (Simulate Docker Build)
        run: |
          echo "Building Docker image..."
          echo "docker build -t app:latest ."

      - name: Push Artifact (Simulate Artifactory)
        run: |
          echo "Pushing image to Artifactory..."
          echo "docker push app:latest"

      - name: Security Scan (Simulated)
        run: |
          echo "Running security scan..."
          echo "Scan passed"

      - name: Deploy (Simulate Helm + OpenShift)
        run: |
          echo "Deploying to OpenShift using Helm..."